name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Convierte la plantilla de Flask en una página estática en modo "navegador"
      - name: Construir sitio estático
        run: |
          mkdir -p _site
          cp -R agente-investigador/static _site/static
          sed \
            -e "s|{{ url_for('static', filename='\([^']*\)') }}|static/\1|g" \
            -e 's|window.AGENTE_MODO = "servidor"|window.AGENTE_MODO = "navegador"|' \
            agente-investigador/templates/index.html > _site/index.html
          touch _site/.nojekyll
          if grep -q "{{" _site/index.html; then
            echo "Quedaron etiquetas de Jinja sin convertir en index.html"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
